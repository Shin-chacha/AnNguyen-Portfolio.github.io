<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects · Nguyen Quoc An</title>
  <meta name="description" content="Finance, analytics and machine-learning projects by Nguyen Quoc An, filterable by skill.">
  <meta name="theme-color" content="#252936">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main" class="container">
    <div class="page-head">
      <p class="kicker">Portfolio</p>
      <h1>Projects</h1>
      <p class="section-sub" id="proj-sub"></p>
    </div>

    <form class="filters" id="filters" role="search" onsubmit="return false">
      <div class="search">
        <label for="q">Search projects</label>
        <input id="q" type="search" name="q" placeholder="e.g. valuation, SHAP, dashboard" autocomplete="off">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4 A6 6 0 1 1 9.99 4 Z M14.5 14.5 L20 20"/></svg>
      </div>
      <div class="filter-group">
        <h2 id="view-h">View for a role</h2>
        <ul class="chips" id="view-chips" aria-labelledby="view-h"></ul>
      </div>
      <div class="filter-group">
        <h2 id="cat-h">Category</h2>
        <ul class="chips" id="cat-chips" aria-labelledby="cat-h"></ul>
      </div>
      <div class="filter-group">
        <h2 id="skill-h">Skill</h2>
        <ul class="chips" id="skill-chips" aria-labelledby="skill-h"></ul>
      </div>
    </form>

    <div class="results-bar">
      <p id="result-count" role="status" aria-live="polite" style="margin:0"></p>
      <button type="button" class="link-btn" id="clear" hidden>Clear filters</button>
    </div>

    <section aria-labelledby="feat-h" id="featured-wrap">
      <h2 class="sr-only" id="feat-h">Featured projects</h2>
      <div class="grid" id="featured"></div>
    </section>

    <section aria-labelledby="arch-h" id="archive-wrap" hidden>
      <div class="sub-head"><h2 class="section-title" id="arch-h">Archive &amp; experiments</h2></div>
      <ul class="archive" id="archive"></ul>
    </section>

    <p class="empty" id="empty" hidden>No projects match these filters. <button type="button" class="link-btn" id="clear2">Clear filters</button></p>
    <div style="height:48px"></div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/js/bg.js?v=202610260441" defer></script>
  <script src="assets/js/data.js?v=202610260441"></script>
  <script src="assets/js/common.js?v=202610260441"></script>
  <script src="assets/js/preview.js?v=202610260441"></script>
  <script src="assets/js/projects.js?v=202610260441"></script>
